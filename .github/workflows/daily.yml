name: daily

# El "día" operativo es UTC: las velas diarias de Binance cierran a las 00:00
# UTC, que en Costa Rica (UTC-6) son las 18:00. La guardia usa la fecha UTC a
# propósito, no la fecha local. Cambiar a America/Costa_Rica haría que el motor
# corriera antes de que cierre la vela diaria.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar corrida aunque ya existan datos de hoy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run_engine: ${{ steps.check.outputs.run_engine }}
    env:
      BINANCE_BASE_URL: https://data-api.binance.vision/api/v3
      TZ: UTC
      FORCE: ${{ github.event.inputs.force || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: python -m pip install -e . -c constraints.txt

      - name: Check if daily run is needed
        id: check
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import sqlite3
          from pathlib import Path

          today = dt.datetime.now(dt.UTC).date().isoformat()
          database = Path("var/trading.db")
          latest = ""
          if database.exists():
              try:
                  connection = sqlite3.connect(database)
                  try:
                      row = connection.execute("SELECT MAX(timestamp) FROM signals").fetchone()
                  finally:
                      connection.close()
                  latest = (row[0] or "")[:10] if row else ""
              except sqlite3.Error:
                  latest = ""
          needed = latest != today
          force = os.getenv("FORCE", "false").strip().lower() == "true"
          run_engine = needed or force
          print(
              f"today={today} latest_signal={latest or 'none'} "
              f"needed={needed} force={force} run_engine={run_engine}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run_engine={'true' if run_engine else 'false'}\n")
          PY

      - name: Check market data endpoint
        if: steps.check.outputs.run_engine == 'true'
        run: |
          python - <<'PY'
          import os
          import httpx

          base = os.environ["BINANCE_BASE_URL"].rstrip("/")
          response = httpx.get(
              f"{base}/klines",
              params={"symbol": "BTCUSDT", "interval": "1d", "limit": 2},
              timeout=30,
          )
          print("status:", response.status_code)
          print(response.text[:300])
          response.raise_for_status()
          PY

      - name: Run daily engine
        if: steps.check.outputs.run_engine == 'true'
        env:
          TRADING_KILL_SWITCH: ${{ vars.TRADING_KILL_SWITCH || 'false' }}
        run: |
          mkdir -p var/reports
          python -m jobs.daily_run --live

      - name: Snapshot SQLite
        if: steps.check.outputs.run_engine == 'true'
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          source = Path("var/trading.db")
          snapshot = Path("var/trading.snapshot.db")
          snapshot.unlink(missing_ok=True)

          connection = sqlite3.connect(source)
          try:
              connection.execute("VACUUM INTO ?", (str(snapshot),))
          finally:
              connection.close()

          check = sqlite3.connect(snapshot)
          try:
              result = check.execute("PRAGMA integrity_check").fetchone()[0]
          finally:
              check.close()
          if result != "ok":
              raise SystemExit(f"integrity_check: {result}")

          for suffix in ("-wal", "-shm"):
              Path(str(source) + suffix).unlink(missing_ok=True)
          os.replace(snapshot, source)
          print("snapshot bytes:", source.stat().st_size, "integrity:", result)
          PY

      - name: Export static PWA
        if: steps.check.outputs.run_engine == 'true'
        run: python -m jobs.export_static --out dist

      - name: Upload PWA artifact
        if: steps.check.outputs.run_engine == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pwa-dist
          path: dist
          retention-days: 1

      - name: Upload state artifact
        if: steps.check.outputs.run_engine == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trading-state
          path: |
            var/trading.db
            var/reports
          retention-days: 1

  publish:
    needs: compute
    if: needs.compute.outputs.run_engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Clean local state
        run: |
          rm -rf var/reports state-artifact
          rm -f var/trading.db var/trading.db-wal var/trading.db-shm

      - name: Download state
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: trading-state
          path: state-artifact

      - name: Restore state
        run: |
          mkdir -p var
          cp -a state-artifact/trading.db var/trading.db
          cp -a state-artifact/reports var/reports
          rm -rf state-artifact

      - name: Download PWA
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pwa-dist
          path: dist

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f var/trading.db var/reports
          if git diff --cached --quiet; then
            echo "Sin cambios de estado"
          else
            git commit -m "chore: estado diario $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
